<!doctype html>
<html
  class="v2"
  dir="ltr"
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:b="http://www.google.com/2005/gml/b"
  xmlns:data="http://www.google.com/2005/gml/data"
  xmlns:expr="http://www.google.com/2005/gml/expr"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="About 1500 Myanmar years, starting from 2 ME, can be found in this Myanmar calendar.
မြန်မာသက္ကရာဇ် 2 ခု ကစပြီး နှစ်ပေါင်း တစ်ထောင့်ငါးရာ ခန့်ရှိတဲ့ မြန်မာရက်တွေကို ဒီပြက္ခဒိန်မှာ ကြည့်နိုင်ပါတယ်။ "
    />
    <meta
      name="keywords"
      content="Myanmar, Burmese, calendar, English, ပြက္ခဒိန်, ျပကၡဒိန္, မြန်မာ, ျမန္မာ,
lunar, lunisolar, ဥပုသ္, ဥပုသ်, ရက္ရာဇာ, ရက်ရာဇာ, ျပႆဒါး, ပြဿဒါး,Yatyaza,Pyathada"
    />
    <meta name="viewport" content="width=device-width" />
    <title>Myanmar Calendar ~1500 years</title>
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link rel="stylesheet" href="mc_s.css" />
    <script src="./javascript/ceMmDateTime.js"></script>
    <script src="./javascript/calendar-ui.js"></script>
    <script>
      // Version: 20260909
      // Required: ./javascript/ceMmDateTime.js
      //----------------------------------------------------------------------------
      //Start of UI ################################################################
      var x = new ceMmTranslate();
      var chron = new ceMmChronicle();
      var dt = new Date();
      var selectedDay;
      //User Interface setting
      var uis = {
        Lang: undefined, //Language
        Type: 0, //Gregorian or Julian
        y: dt.getFullYear(),
        m: 1 + dt.getMonth(),
        cy: dt.getFullYear(),
        BY: 640,
        EY: 2140, //beginning and end of the calendar,
        LT: 1700,
        UT: 2140, //lower and upper threshold for accurate years
      };
      //-------------------------------------------------------------------------
      //initialize the calendar
      function initc() {
        var ce = document.getElementById('mcalg');
        //ce.className="DivMain";
        if (uis.Lang === undefined) {
          var L = ce.lang;
          var F = ce.style.fontFamily;
          if (F == 'Zawgyi-One') L = 'Zawgyi';
          uis.Lang = initialLanguage(SelectLang(L));
        }
        ce.innerHTML = UI();
        mountToolbar();
      }
      //-------------------------------------------------------------------------
      //Select language
      //input: (L: number[0=English, 1=Myanmar, 2=Zawgyi, 3=Mon, 4=Tai, 5=Karen])
      function SelectLang(L) {
        var l = 1;
        if (L == 0 || L == 'English' || L == 'my-En' || L == 'my-en') {
          l = 0;
        } else if (L == 3 || L == 'Moon' || L == 'my-Mon' || L == 'my-mon') {
          l = 3;
        } else if (
          L == 2 ||
          L == 'Zawgyi' ||
          L == 'my-Z1' ||
          L == 'my-z1' ||
          L == 'Zawgyi-One'
        ) {
          l = 2;
        } else if (L == 4 || L == 'Tai' || L == 'my-Tai' || L == 'my-tai') {
          l = 4;
        } else if (L == 5 || L == 'Karen' || L == 'my-Kar' || L == 'my-kar') {
          l = 5;
        } else {
          l = 1;
        }
        return l;
      }
      //-------------------------------------------------------------------------
      function monthOptions() {
        return [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ]
          .map((name, index) => {
            const value = index + 1;
            const selected = value === uis.m ? ' selected' : '';
            return `<option value="${value}"${selected}>${x.T(name, uis.Lang)}</option>`;
          })
          .join('');
      }

      function UI() {
        return `
          <div id="divMonth" class="DivContainerMonth">
            ${calendarToolbar('westernYear', monthOptions())}
            <div id="oc" lang="${calendarLanguage()}">${UIContent()}</div>
          </div>
          <div id="divDay" class="DivContainerDay" style="display:none"></div>
        `;
      }
      //-----------------------------------------------------------------------------
      function showToday() {
        const today = ceDateTime.j2w(localTodayJdn(), uis.Type);
        uis.y = today.y;
        uis.m = today.m;
        document.getElementById('m').value = uis.m;
        showSelectedYear();
        DisplayUI(0);
        focusToday();
      }

      //change month
      //input: (v: value [1: increase, -1: decrease])
      function emc(v) {
        var me = document.getElementById('m');
        var mn = uis.m;
        var yn = uis.y;
        mn += Number(v);
        if (mn <= 0) {
          mn += 12;
          yn--;
        } else if (mn > 12) {
          mn -= 12;
          yn++;
        }
        if (yn < uis.BY || yn > uis.EY) return;
        uis.y = yn;
        uis.m = mn;
        mn--;
        me.selectedIndex = mn;
        showSelectedYear();
        DisplayUI(0);
      }
      //-------------------------------------------------------------------------
      //display UI
      //input: (cev: calendar element to update [1:year, 2:month,
      //4:language, 3: type])
      function DisplayUI(cev) {
        switch (cev) {
          case 1:
            var year = readYear();
            if (year === null) return;
            if (year === uis.y) {
              showSelectedYear();
              return;
            }
            uis.y = year;
            showSelectedYear();
            break;
          case 2:
            var me = document.getElementById('m');
            uis.m = Number(me.value);
            break; //month
          case 3:
            var te = document.getElementById('calType');
            uis.Type = te.value;
            break; //type
          case 4:
            var le = document.getElementById('calLang');
            uis.Lang = SelectLang(le.value);
            document.getElementById('m').innerHTML = monthOptions();
            localizeToolbar();
            break; //Language
        }
        var oce = document.getElementById('oc');
        oce.lang = calendarLanguage();
        oce.innerHTML = UIContent();
      }
      //-------------------------------------------------------------------------
      //Produce html string for calendar content
      //output: (str: html string)
      function UIContent() {
        var r, i, js, je, eml, tstr;
        var syt = uis.Lang == 4 ? 1 : 0; // if Shan culture, set Sasana year type to 1
        //------------------------------------------------------------------------
        const todayJdn = localTodayJdn();
        //------------------------------------------------------------------------
        var MS = new ceMmDateTime(); // start of month
        MS.SetTimezone(0);
        MS.syt = syt;
        MS.SetDateTime(uis.y, uis.m, 1, 12, 0, 0, 0, uis.Type); // time zone is irrelevant
        js = MS.jdn; //Find julian day number of start of
        //the month according to calendar type
        eml = MS.mlen; //get the length of the month
        je = js + eml - 1; //Julian day number of end of the month
        var ME = new ceMmDateTime(); // end of month
        ME.SetTimezone(0);
        ME.syt = syt;
        ME.SetJD(je);
        //------------------------------------------------------------------------
        //Start of the table for calendar days
        var str = " <table class='TableMC'> ";
        str += tHead(MS, ME); //header
        str += tFoot(); //footer
        str += '<tbody>';
        str += tWeek(); //Weekday header row

        //Calendar days are populated starting from second row
        r = (MS.w + 6) % 7;
        eml = Math.ceil((eml + r) / 7) * 7;
        var M = new ceMmDateTime(); // end of month
        M.SetTimezone(0);
        M.SetCT(uis.Type);
        M.syt = syt; // if Shan culture, start Sasana year depending on moon phase, i.e. Kason full moon
        for (i = 0; i < eml; i++) {
          if (i % 7 == 0) str += '<tr>';
          //start of checking valid day to display
          if (i >= r && js <= je) {
            M.SetJD(js);
            //Check holidays, weekend, inaccurate days and change style
            tstr = 'PriDay';
            if (js === todayJdn) tstr = 'PriDayToday';
            else if (M.holidays.length > 0) tstr = 'PriDayHoliday';
            else if (M.w == 0 || M.w == 1) tstr = 'PriDayWeekend';
            else if (uis.y < uis.LT || uis.y > uis.UT) tstr = 'PriDayInaccu';

            str += "<td class='TdMC' onclick='ShowDay(" + js + ")'>";
            str += "<p class='PTdMC'>";
            str +=
              "<button type='button' class='DayButton " +
              tstr +
              "' id='day-" +
              js +
              "' " +
              (js === todayJdn ? "aria-current='date' " : '') +
              "aria-label='" +
              x.T(M.ToString('%W, %M %d, %y'), uis.Lang) +
              "'>" +
              x.T(String(M.d), uis.Lang) +
              '</button>';

            //sabbath and moon just beside English day
            str +=
              " <span class='MCSabbath'> " +
              x.T(M.sabbath, uis.Lang) +
              '</span>';
            if (M.mp == 1) str += " <canvas class='FM'></canvas> ";
            else if (M.mp == 3) str += " <canvas class='NM'></canvas> ";
            str += '</p>';
            //displaying Myanmar date
            if (M.my >= 2) {
              str += mMDStr(M);
            }

            str += '</td>';
            js++; //Julian day number for next day
          } //end of checking valid day to display
          else {
            str += "<td class='TdMC'><p class='PTdMC'>";
            str += '&nbsp;';
            str += '</p></td>';
          } //if no day to display
          if (i % 7 == 6) str += '</tr>'; //next row
        } //end of for loop

        str += '</tbody></table>';
        //------------------------------------------------------------------------
        return str;
      }
      //-------------------------------------------------------------------------
      //Produce html string for calendar day table header
      //input: (MS: Myanmar date at the start ,
      // ME: Myanmar date at the end)
      //output: (str: html string)
      function tHead(MS, ME) {
        var str = '';
        var tstr =
          "<thead> <tr> <th colspan=7 class='ThMC'>\
	    <p class='PThMC'>"; //table header
        str +=
          MS.ToString('%y %M') +
          ',' + //english year and month
          ' Sasana Year ' +
          MS.ToMString('&YYYY'); //Sasana year
        if (MS.sy != ME.sy) str += ' - ' + ME.ToMString('&YYYY');
        str += ' Ku,';
        if (ME.my >= 2) {
          //if Myanmar year after 2 ME
          str += ' Myanmar Year ';
          if (MS.my >= 2) {
            str += MS.ToMString('&yyyy');
            if (MS.my != ME.my) str += ' - ';
          }
          if (MS.my != ME.my) str += ME.ToMString('&yyyy');
          str += ' Ku, ';
          if (MS.my >= 2) {
            str += MS.ToMString('&M');
            if (MS.mm != ME.mm) str += ' - ';
          }
          if (MS.mm != ME.mm) {
            str += ME.ToMString('&M');
          }
        }
        str = x.T(str, uis.Lang);
        tstr += str + '</p></th></tr></thead>';
        return tstr;
      }
      //-------------------------------------------------------------------------
      //Produce html string for calendar day table footer
      //output: (str: html string)
      function tFoot() {
        return calendarFooter('./m.htm', 'browseMyanmar');
      }
      //-------------------------------------------------------------------------
      //Produce html string for calendar day table weekday header row
      //output: (str: html string)
      function tWeek() {
        //first row of table body is weekdays starting from Sunday to Saturday
        var str =
          "<tr><td class='TdMC'><p class='PTdWeekendMC'>" +
          'Sunday' +
          "</p></td> \
	<td class='TdMC'><p class='PTdWeekdayMC'>" +
          'Monday' +
          "</p></td> \
	<td class='TdMC'><p class='PTdWeekdayMC'>" +
          'Tuesday' +
          "</p></td> \
	<td class='TdMC'><p class='PTdWeekdayMC'>" +
          'Wednesday' +
          "</p></td>\
	<td class='TdMC'><p class='PTdWeekdayMC'>" +
          'Thursday' +
          "</p></td> \
	<td class='TdMC'><p class='PTdWeekdayMC'>" +
          'Friday' +
          "</p></td> \
	<td class='TdMC'><p class='PTdWeekendMC'>" +
          'Saturday' +
          '</p></td></tr>';
        str = x.T(str, uis.Lang);
        return str;
      }
      //-------------------------------------------------------------------------
      //Produce html string for Myanmar day
      //input: (M: Myanmar date)
      //output: (str: html string)
      function mMDStr(M) {
        var str = '',
          tstr = '';

        //month name
        str += "<p class='PTdMC'>";
        str += M.ToMString('&M');
        str += '</p>';

        //moon phase and day
        tstr = 'SecDa';
        if (M.sabbath == 'Sabbath') tstr = 'SecDaH';
        str += "<p class='" + tstr + "'>";
        str += M.ToMString('&P');
        if (M.mp % 2 == 0) {
          str += ' ' + M.ToMString('&f');
        }
        str += '</p>';

        //holiday
        var sa = M.holidays;
        str += "<p class='MCPubHol'>" + sa.join('<br/>') + '</p>';
        sa = M.holidays2;
        str += "<p class='MCHol'>" + sa.join('<br/>') + '</p>';

        //astroligical days
        str += "<p class='MCYtyz'>" + M.yatyaza + '</p>';
        str += "<p class='MCYtyz'>" + M.pyathada + '</p>';

        //historical dates
        try {
          var ih = chron.hSearch(M.jdn); //search for historical date
          if (ih >= 0) {
            str += "<p class='HLabel'>History</p>";
          }
        } catch (err) {}
        str = x.T(str, uis.Lang);
        return str;
      }
      //-------------------------------------------------------------------------
      //Show day and hide month
      //input: js (Julian day)
      //output: void
      function ShowDay(js) {
        selectedDay = js;
        var str = '',
          tstr = '';
        var M = new ceMmDateTime(js, 0, uis.Type);
        var syt = uis.Lang == 4 ? 1 : 0; // if Shan, set Sasana year type to 1
        M.syt = syt;
        //display English day
        str +=
          "<h1 class='DayHead' id='dayHeading' tabindex='-1'>" +
          x.T(M.ToString('%y-%M-%dd'), uis.Lang) +
          '</h1>';

        //displaying Myanmar date
        if (M.my >= 2) {
          tstr = 'Sasana Year ' + M.ToMString('&YYYY');
          tstr = x.T(tstr, uis.Lang);
          str += "<p class='DaFontSize'>" + tstr + '</p>'; //Sasana year

          tstr = 'Myanmar Year ' + M.ToMString('&yyyy');
          tstr = x.T(tstr, uis.Lang);
          str += "<p class='DaFontSize'>" + tstr + '</p>'; //Myanmar year

          //month name, moon phase and day
          tstr = 'SecDa';
          if (M.sabbath == 'Sabbath') tstr = 'SecDaH';
          str += "<p class='" + tstr + " DaFontSize'>";
          tstr = M.ToMString('&M &P');
          if (M.mp % 2 == 0) {
            tstr += ' ' + M.ToMString('&f');
          }
          tstr = x.T(tstr, uis.Lang);
          str += tstr + '</p>';

          //weekday
          tstr = M.ToString('%W');
          tstr = x.T(tstr, uis.Lang);
          str += '<p>' + tstr + '</p>';

          //sabbath and moon
          if (M.sabbath != '') {
            tstr = M.sabbath;
            tstr = x.T(tstr, uis.Lang);
            str += "<p class='MCSabbath DaFontSize'>" + tstr;
            if (M.mp == 1) str += " <canvas class='FM'></canvas> ";
            else if (M.mp == 3) str += " <canvas class='NM'></canvas> ";
            str += '</p>';
          }

          //holiday  DaFontSize
          var sa = M.holidays;
          tstr = "<p class='MCPubHol DaFontSize'>" + sa.join('<br/>') + '</p>';
          sa = M.holidays2;
          tstr += "<p class='MCHol DaFontSize'>" + sa.join('<br/>') + '</p>';

          str += x.T(tstr, uis.Lang);
          tstr = '';
          //astroligical days
          if (M.yatyaza != '') {
            tstr = "<p class='MCYtyz DaFontSize'>" + M.yatyaza + '</p>';
          }
          if (M.pyathada != '') {
            tstr += "<p class='MCYtyz DaFontSize'>" + M.pyathada + '</p>';
          }
          sa = M.astro;
          tstr += "<p class='MCAstro DaFontSize'>" + sa.join('<br/>') + '</p>';

          str += x.T(tstr, uis.Lang);
          str +=
            "<p class='MCAstro DaFontSize'>" +
            x.T(M.my_name + ' Year', uis.Lang) +
            '</p>'; //year name
          str +=
            "<p class='MCAstro DaFontSize'>" +
            x.T('Mahabote - ' + M.mahabote + ' Born', uis.Lang) +
            '</p>'; //mahabote
          str +=
            "<p class='MCAstro DaFontSize'>" +
            x.T(M.nakhat + ' Nakhat', uis.Lang) +
            '</p>';
          str +=
            "<p class='MCAstro DaFontSize'>" +
            x.T('Naga Head ' + M.nagahle + ' Facing', uis.Lang) +
            '<p/>';

          //Thingyan
          if (M.m == 4) {
            str +=
              "<p><a class='AnchorFootMC DaFontSize' href='https://yan9a.github.io/mmcal/html/Thingyan.htm'>" +
              x.T('Thingyan Calculator', uis.Lang) +
              ' &gt;&gt;</a></p>';
          }
        }
        str += "<p class='DaFoot'>JDN: " + js + '</p>'; //julian day number

        //historical dates
        try {
          var ih = chron.hSearch(M.jdn); //search for historical date
          if (ih >= 0) {
            str +=
              "<p class='DaFontSize HLabel'>History: " +
              chron.chronicle(M.jdn) +
              "<a class='DaFontSize AnchorFootMC' href='./html/chronicles.htm?jdn=" +
              M.jdn +
              "'> Read more...</a> </p>";
          }
        } catch (err) {}

        if (M.y < uis.cy) {
          //rulers
          try {
            var ra = chron.ruler(M.jdn);
            if (ra.length > 0) {
              var i = 0;
              var r;
              var dyn;
              if (js < 2432555) str += "<p class='DaFoot'>Ruler(s):</p>";
              else str += "<p class='DaFoot'>President:</p> ";
              str += "<ul class='DaFoot'>";
              for (i = 0; i < ra.length; i++) {
                r = ra[i];
                str +=
                  "<li><a class='AnchorFootMC DaFoot' href='" +
                  r.URL +
                  "'>" +
                  r.Name +
                  '</a>';
                dyn = chron.dynasty(r.Dynasty);
                str +=
                  '<br/>' +
                  "<a class='AnchorFootMC DaFoot' href='" +
                  dyn.URL +
                  "'>" +
                  dyn.Description +
                  '</a>';
                str += '</li>';
              }
              str += '</ul>';
            }
          } catch (err) {}
        }

        //accuracy
        if (uis.y < uis.LT || uis.y > uis.UT)
          str += `<p class="DaFoot" lang="${uiLanguage()}">${uiLabel('accuracy')}</p>`;

        str += `<button type="button" id="back2main" class="BtnBack" lang="${uiLanguage()}"
          onclick="ShowMonth()">${uiLabel('back')}</button>`;

        var ddiv = document.getElementById('divDay');
        ddiv.innerHTML = str;
        ddiv.lang = calendarLanguage();
        ddiv.style.display = 'block';
        var mdiv = document.getElementById('divMonth');
        mdiv.style.display = 'none';
        document.getElementById('dayHeading').focus();
      }
      //-------------------------------------------------------------------------
      //Show month and hide day
      function ShowMonth() {
        var mdiv = document.getElementById('divMonth');
        mdiv.style.display = 'block';
        var ddiv = document.getElementById('divDay');
        ddiv.style.display = 'none';
        document.getElementById('day-' + selectedDay)?.focus();
      }
      //-------------------------------------------------------------------------
      //End of UI ##################################################################
    </script>
  </head>

  <body>
    <div id="mcalg"></div>
    <script>
      initc();
      ceMmChronicleDataReady.then(() => {
        chron = new ceMmChronicle();
        DisplayUI(0);
      });
    </script>
  </body>
</html>
